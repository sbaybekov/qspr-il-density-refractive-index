[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qspr-il-density-refractive-index"
version = "0.1.0"
description = "QSPR models for predicting density and refractive index of ionic-liquid mixtures"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shamkhal Baybekov" },
    { name = "Kamran Heydarov" },
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "mordredcommunity>=2.0.6",
    "rdkit>=2023.9",
    "joblib>=1.5",
    "xgboost",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gui = ["streamlit>=1.38", "matplotlib>=3.8", "reportlab>=4.0"]
dev = ["pytest>=8.0"]
docs = ["sphinx>=7.0", "furo", "sphinxcontrib-mermaid>=1.0"]

[project.scripts]
qspr-il-predict = "qspr_il.cli:main"

[tool.setuptools.packages.find]
include = ["qspr_il*"]

[tool.setuptools.package-data]
qspr_il = [
    "models/*/*/*.joblib",
    "models/*/*/*.json",
    "data/ionics/keydata/*.csv",
    "assets/*.png",
]
